name: Build private unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idm-private-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Compile IDM for sideloading
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          # Liquid Glass and the iOS 26 SDK require Xcode 26+. Pick the newest
          # installed Xcode 26.x, falling back to the default Xcode.app.
          XCODE_PATH=""
          for candidate in $(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V -r); do
            if [[ -d "$candidate/Contents/Developer" ]]; then
              XCODE_PATH="$candidate/Contents/Developer"
              break
            fi
          done
          if [[ -z "$XCODE_PATH" && -d "/Applications/Xcode.app/Contents/Developer" ]]; then
            XCODE_PATH="/Applications/Xcode.app/Contents/Developer"
          fi
          if [[ -z "$XCODE_PATH" ]]; then
            echo "No Xcode 26 found on this runner. Installed Xcodes:"
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_PATH"
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | sed -n 's/^Xcode \([0-9][0-9]*\).*/\1/p')"
          if [[ -z "$XCODE_MAJOR" || "$XCODE_MAJOR" -lt 26 ]]; then
            echo "Xcode 26 or newer is required (iOS 26 / Liquid Glass). Installed Xcodes:"
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi

      - name: Locate and inspect Xcode project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_PATH="$(find "$GITHUB_WORKSPACE" -type d -name 'IDM.xcodeproj' -print -quit)"
          if [[ -z "$PROJECT_PATH" ]]; then
            echo "IDM.xcodeproj was not found. Upload the complete project folder."
            exit 1
          fi
          echo "path=$PROJECT_PATH" >> "$GITHUB_OUTPUT"
          xcodebuild -project "$PROJECT_PATH" -list

      - name: Build unsigned iPhone application
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -project "${{ steps.project.outputs.path }}" \
            -scheme IDM \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/IDM-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build 2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/IDM-DerivedData/Build/Products/Release-iphoneos/IDM.app"
          ARTIFACT_DIR="$GITHUB_WORKSPACE/artifacts"
          PACKAGE_ROOT="$RUNNER_TEMP/IDM-Package"

          test -d "$APP_PATH"
          test -d "$APP_PATH/PlugIns/IDMLiveActivity.appex"
          test -d "$APP_PATH/PlugIns/IDMShareExtension.appex"

          # Preserve the App Group claims so personal sideloading tools can
          # request matching profiles while re-signing the IPA.
          codesign --force --sign - \
            --entitlements "$GITHUB_WORKSPACE/IDMShareExtension/IDMShareExtension.entitlements" \
            "$APP_PATH/PlugIns/IDMShareExtension.appex"
          codesign --force --sign - "$APP_PATH/PlugIns/IDMLiveActivity.appex"
          codesign --force --sign - \
            --entitlements "$GITHUB_WORKSPACE/IDM/IDM.entitlements" \
            "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"

          mkdir -p "$ARTIFACT_DIR" "$PACKAGE_ROOT/Payload"
          ditto "$APP_PATH" "$PACKAGE_ROOT/Payload/IDM.app"
          ditto -c -k --sequesterRsrc --keepParent "$PACKAGE_ROOT/Payload" "$ARTIFACT_DIR/IDM-unsigned.ipa"
          shasum -a 256 "$ARTIFACT_DIR/IDM-unsigned.ipa" | tee "$ARTIFACT_DIR/IDM-unsigned.ipa.sha256"
          unzip -t "$ARTIFACT_DIR/IDM-unsigned.ipa"

          {
            echo "## IDM unsigned IPA created"
            echo ""
            echo "Download the **IDM-unsigned-IPA** artifact from this workflow run."
            echo "The IPA contains the IDM app, its Live Activity extension, and its Share extension."
            echo "It has not been submitted to Apple and contains no signing identity."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sideloading package
        uses: actions/upload-artifact@v4
        with:
          name: IDM-unsigned-IPA
          path: |
            artifacts/IDM-unsigned.ipa
            artifacts/IDM-unsigned.ipa.sha256
            xcodebuild.log
          if-no-files-found: error
          retention-days: 14
